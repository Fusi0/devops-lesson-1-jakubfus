# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test and Scan

on:
  push:
    branches:
      - main
    pull_request:
      types: [opened, synchronize, closed]
      branches:
        - main

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest -rA services/${{matrix.service}} > ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-${{matrix.python-version}} test report
          path: ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - run: pip install bandit
      - run: bandit -r services/${{matrix.service}} -f html -o ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html
        continue-on-error: true
      - name: Upload Bandit Report as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.service}}-${{matrix.python-version}}-bandit-report
          path: ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html

  deploy:
    needs: ["run_tests"]

    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      -  uses: actions/download-artifact@v7
         with:
          name: tasks-api-3.12-bandit-report 
          path: _site
      -  uses: actions/download-artifact@v7
         with:
          name: title-normalizer-3.12-bandit-report
          path: _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site 
      - uses: actions/deploy-pages@v5

      - run: |
          cat _site/index.html <<'EOF'
          <h1>Bandit Report</h1>
          <p> href="tasks-api-3.12-bandit-report.html">Tasks API Bandit Report</a></p>
          <p> href="title-normalizer-3.12-bandit-report.html">Title Normalizer Bandit Report</a></p>
          'EOF'


      - id: deploy-pages
        uses: actions/deploy-pages@v5
